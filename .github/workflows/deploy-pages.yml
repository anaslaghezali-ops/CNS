name: Déployer ChickNSter sur GitHub Pages

on:
  push:
    branches: ["claude/chicknster-reconciliation-system-460chx"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Téléverser le dossier docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
